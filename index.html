<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMEN</title>
<style>body{font:16px system-ui;max-width:32rem;margin:2rem auto;padding:0 1rem}label{display:block;margin:.5rem 0}input,select{width:100%;padding:.3rem}pre{background:#eee;padding:1rem;white-space:pre-wrap}.bar{position:relative;display:flex;height:2rem;background:#ddd;border-radius:4px;margin:1rem 0 .25rem}.bar i{display:block;height:100%}.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#000}#leg{font-size:.85rem}</style>
<h1>OMEN: GPU fit calculator</h1>
<label>Use case <select id=uc></select></label>
<label>Model <select id=m></select></label>
<label>Quantization <select id=q></select></label>
<label>GPU <select id=g></select></label>
<label>Context (tokens) <input id=c type=number value=8192></label>
<label>Users <input id=u type=number value=4></label>
<details open><summary>Assumptions (editable)</summary>
<label>Overhead GiB (CUDA context, activations) <input id=ov type=number step=0.1 value=1.5></label>
<label>GPU price $/hr <input id=pr type=number step=0.01></label>
<p id=asm></p></details>
<div class=bar id=bar></div><div id=leg></div>
<pre id=out></pre>
<div id=meas></div>
<script src="models.js"></script>
<script src="usecases.js"></script>
<script src="quants.js"></script>
<script src="memtypes.js"></script>
<script src="gpus.js"></script>
<script src="measured.js"></script>
<script src="fit.js"></script>
<script>
const MODELS = Object.assign({}, ...Object.values(MODELS_BY_CREATOR));
const QUANTS = Object.assign({}, ...Object.values(QUANTS_BY_FAMILY));
const GPUS = Object.assign({}, ...Object.values(GPUS_BY_VENDOR));
const FENCE = "\x60\x60\x60"; // markdown code fence
const IDS = ["uc", "m", "q", "g", "c", "u", "ov", "pr"]; // inputs stored in the URL
const KV_BYTES = 2; // fp16 KV cache

const $ = id => document.getElementById(id);
const groups = (by, keep = () => true) => Object.entries(by).map(([k, o]) => [k, Object.keys(o).filter(keep)])
  .filter(([, names]) => names.length).map(([k, names]) =>
  `<optgroup label="${k}">${names.map(n => `<option>${n}</option>`).join("")}</optgroup>`).join("");
const inUseCase = n => $("uc").value == "All" || (MODEL_USE_CASES[n] || ["General"]).includes($("uc").value);
function fillModels() { // list only models for the chosen use case, keep the current pick if still listed
  const prev = $("m").value; $("m").innerHTML = groups(MODELS_BY_CREATOR, inUseCase);
  if ([...$("m").options].some(o => o.value == prev)) $("m").value = prev;
}
$("uc").innerHTML = ["All", ...Object.keys(USE_CASE_CONTEXT)].map(n => `<option>${n}</option>`).join("");
fillModels(); $("q").innerHTML = groups(QUANTS_BY_FAMILY); $("g").innerHTML = groups(GPUS_BY_VENDOR);
$("q").value = "fp16 / bf16"; $("g").value = "RTX 4090 24GB";
$("m").value = "Llama-3.1-8B";

// Minimum GPUs: (weights + users*KV) / VRAM, rounded up. Ignores per-GPU overhead and interconnect losses.
const minGpus = (q, p, kv, users, gib) => Math.ceil((p * 1e9 * QUANTS[q] / 2 ** 30 + users * kv) / gib);

function render() {
  const [p, L, h, d, act] = MODELS[$("m").value], [gib, bw] = GPUS[$("g").value], usd = +$("pr").value, ov = +$("ov").value;
  const r = fit(p, QUANTS[$("q").value], L, h, d, KV_BYTES, +$("c").value, gib, bw, usd, ov, act);
  const ok = r.users >= +$("u").value;
  const run = RUNS.find(x => x.model == $("m").value && x.quant == $("q").value && x.gpu == $("g").value);
  const need = r.weights + ov + r.kv * +$("u").value, scale = Math.max(gib, need), pc = x => (100 * x / scale) + "%";
  $("asm").textContent = `GPU: ${gib} GiB VRAM, ${bw} GB/s bandwidth (vendor datasheet, from memory). Price: assumed, not a quote. Model config: layers/KV heads/head dim from the model's Hugging Face config.json (see models.js). KV cache assumed fp16. Speed = bandwidth / weight bytes read per token (active params for MoE).`;
  const seg = (x, c) => `<i style="width:${pc(x)};background:${c}"></i>`;
  $("bar").innerHTML = seg(r.weights, "#4a6fa5") + seg(r.kv * +$("u").value, "#e0a030") + seg(ov, "#888") + `<b style="left:${pc(gib)}"></b>`;
  $("leg").textContent = `blue weights ${r.weights.toFixed(1)} | orange KV for ${$("u").value} users ${(r.kv * $("u").value).toFixed(1)} | gray overhead ${ov} | black line = GPU limit ${gib} GiB` + (need > gib ? " | OVER LIMIT" : "");
  $("out").textContent =
`Verdict:        ${ok ? "FITS" : "DOES NOT FIT"} ${$("u").value} users (headroom ${r.free.toFixed(1)} GiB before KV)
Weights:        ${r.weights.toFixed(1)} GiB
KV per user:    ${r.kv.toFixed(2)} GiB
Max users:      ${r.users}
Tokens/s max:   ${r.users ? Math.round(r.tok) + " (single-user ceiling)" : "n/a (doesn't fit)"}
Cost/user-hour: ${r.users ? "$" + r.cost.toFixed(3) : "n/a (doesn't fit)"}
${ok ? "" : `Needs at least ${minGpus("fp16 / bf16", p, r.kv, +$("u").value, gib)} x this GPU in fp16, or ${minGpus("GPTQ / AWQ int4", p, r.kv, +$("u").value, gib)} in int4 (minimums: ignore per-GPU overhead and interconnect losses).
`}Confidence:     ${run ? "speed MEASURED (below), rest estimated" : "estimated"}`;
  const issue = JSON.stringify({ model: $("m").value, quant: $("q").value, gpu: $("g").value, context: +$("c").value, users: 1, engine: "", tok_s: 0, source: "" }, null, 2);
  $("meas").innerHTML = (run ? `<p><b>Measured:</b> ${run.tok_s} tok/s on ${run.engine} vs predicted ceiling ${Math.round(r.tok)} (predicted is ${(r.tok / run.tok_s).toFixed(2)}x measured). <a href="${run.source}">source</a></p>` : "")
    + `<p><a href="https://github.com/SrijithLegend/OMEN/issues/new?title=${encodeURIComponent("Measured run: " + $("m").value + " on " + $("g").value)}&body=${encodeURIComponent(FENCE + "json\n" + issue + "\n" + FENCE)}">Submit your measured run</a></p>`;
  history.replaceState(null, "", "?" + new URLSearchParams(IDS.map(i => [i, $(i).value])));
}
const setPrice = () => $("pr").value = GPUS[$("g").value][2];
document.querySelectorAll("select,input").forEach(e => e.oninput = render);
$("g").addEventListener("input", () => { setPrice(); render(); });
$("uc").oninput = () => { fillModels(); if ($("uc").value != "All") $("c").value = USE_CASE_CONTEXT[$("uc").value]; render(); };
setPrice();
const P = new URLSearchParams(location.search);
if (P.has("uc")) { $("uc").value = P.get("uc"); fillModels(); } // filter first so the model can be set
for (const [k, v] of P) if (IDS.includes(k) && k != "uc") $(k).value = v; // shared link
render();
</script>
