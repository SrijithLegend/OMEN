<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMEN</title>
<style>body{font:16px system-ui;max-width:32rem;margin:2rem auto;padding:0 1rem}label{display:block;margin:.5rem 0}input,select{width:100%;padding:.3rem}pre{background:#eee;padding:1rem;white-space:pre-wrap}.bar{position:relative;display:flex;height:2rem;background:#ddd;border-radius:4px;margin:1rem 0 .25rem}.bar i{display:block;height:100%}.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#000}#leg{font-size:.85rem}</style>
<h1>OMEN: GPU fit calculator</h1>
<label>Model <select id=m></select></label>
<label>Quantization <select id=q></select></label>
<label>GPU <select id=g></select></label>
<label>Context (tokens) <input id=c type=number value=8192></label>
<label>Users <input id=u type=number value=4></label>
<div class=bar id=bar></div><div id=leg></div>
<pre id=out></pre>
<script src="models.js"></script>
<script src="quants.js"></script>
<script src="memtypes.js"></script>
<script src="gpus.js"></script>
<script>
const MODELS = Object.assign({}, ...Object.values(MODELS_BY_CREATOR));
const QUANTS = Object.assign({}, ...Object.values(QUANTS_BY_FAMILY));
const GPUS = Object.assign({}, ...Object.values(GPUS_BY_VENDOR));
const KV_BYTES = 2; // fp16 KV cache

function fit(params_b, bytes_per_param, layers, kv_heads, head_dim, kv_bytes,
             context, gpu_gib, gpu_bw_gbs, gpu_usd_hr, overhead_gib = 1.5, active_params_b = params_b) {
  const weights = params_b * 1e9 * bytes_per_param / 2 ** 30;
  const kv = 2 * layers * kv_heads * head_dim * kv_bytes * context / 2 ** 30;
  const free = gpu_gib - weights - overhead_gib;
  const users = Math.max(0, Math.floor(free / kv));
  return { weights, kv, free, users, fits: free >= kv,
    tok: gpu_bw_gbs * 1e9 / (active_params_b * 1e9 * bytes_per_param),
    cost: users ? gpu_usd_hr / users : null };
}

const $ = id => document.getElementById(id);
const groups = by => Object.entries(by).map(([k, o]) =>
  `<optgroup label="${k}">${Object.keys(o).map(n => `<option>${n}</option>`).join("")}</optgroup>`).join("");
$("m").innerHTML = groups(MODELS_BY_CREATOR); $("q").innerHTML = groups(QUANTS_BY_FAMILY); $("g").innerHTML = groups(GPUS_BY_VENDOR);
$("q").value = "fp16 / bf16"; $("g").value = "RTX 4090 24GB";
$("m").value = "Llama-3.1-8B";

// Minimum GPUs: (weights + users*KV) / VRAM, rounded up. Ignores per-GPU overhead and interconnect losses.
const minGpus = (q, p, kv, users, gib) => Math.ceil((p * 1e9 * QUANTS[q] / 2 ** 30 + users * kv) / gib);

function render() {
  const [p, L, h, d, act] = MODELS[$("m").value], [gib, bw, usd] = GPUS[$("g").value];
  const r = fit(p, QUANTS[$("q").value], L, h, d, KV_BYTES, +$("c").value, gib, bw, usd, 1.5, act);
  const ok = r.users >= +$("u").value;
  const need = r.weights + 1.5 + r.kv * +$("u").value, scale = Math.max(gib, need), pc = x => (100 * x / scale) + "%";
  const seg = (x, c) => `<i style="width:${pc(x)};background:${c}"></i>`;
  $("bar").innerHTML = seg(r.weights, "#4a6fa5") + seg(r.kv * +$("u").value, "#e0a030") + seg(1.5, "#888") + `<b style="left:${pc(gib)}"></b>`;
  $("leg").textContent = `blue weights ${r.weights.toFixed(1)} | orange KV for ${$("u").value} users ${(r.kv * $("u").value).toFixed(1)} | gray overhead 1.5 | black line = GPU limit ${gib} GiB` + (need > gib ? " | OVER LIMIT" : "");
  $("out").textContent =
`Verdict:        ${ok ? "FITS" : "DOES NOT FIT"} ${$("u").value} users (headroom ${r.free.toFixed(1)} GiB before KV)
Weights:        ${r.weights.toFixed(1)} GiB
KV per user:    ${r.kv.toFixed(2)} GiB
Max users:      ${r.users}
Tokens/s max:   ${r.users ? Math.round(r.tok) + " (single-user ceiling)" : "n/a (doesn't fit)"}
Cost/user-hour: ${r.users ? "$" + r.cost.toFixed(3) : "n/a (doesn't fit)"}
${ok ? "" : `Needs at least ${minGpus("fp16 / bf16", p, r.kv, +$("u").value, gib)} x this GPU in fp16, or ${minGpus("GPTQ / AWQ int4", p, r.kv, +$("u").value, gib)} in int4 (minimums: ignore per-GPU overhead and interconnect losses).
`}Confidence:     estimated`;
}
document.querySelectorAll("select,input").forEach(e => e.oninput = render);
render();
</script>
