# Run from this folder: docker compose up --build   (API on :8000, Prometheus on :9090)
# Set OMEN_ADMIN_KEY in your shell first; the compose file refuses to start without it.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: omen, POSTGRES_PASSWORD: omen, POSTGRES_DB: omen }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OMEN_DB: postgresql+psycopg://omen:omen@db/omen
      OMEN_ADMIN_KEY: ${OMEN_ADMIN_KEY:?set OMEN_ADMIN_KEY}
    depends_on: [db]
  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
volumes:
  pgdata:
